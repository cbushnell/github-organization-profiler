[project]
name = "github-organization-profiler"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PyGithub>=2.3",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "pre-commit>=4.6.0",
]

[project.scripts]
github-organization-profiler = "github_organization_profiler.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/github_organization_profiler"]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "respx>=0.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires real GitHub API (skip with -m 'not integration')",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/github_organization_profiler/reports/render.py" = ["E501"]
"tests/**" = ["E501"]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
]
